name: Publish T-Net branding v5.6
on:
  push:
    paths:
      - '.github/workflows/v56.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows T-Net and publish after validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory work | Out-Null
          Expand-Archive releases/AirtelMonitor-5.5.0.zip work
          python release-candidate/patch_v56.py
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('work/monitor.ps1',[ref]$null,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw 'Monitoring engine syntax invalid'}
          Add-Type -Path work/AirtelMonitorNative.cs -OutputAssembly test.exe -OutputType WindowsApplication -ReferencedAssemblies @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','System.Windows.Forms.DataVisualization.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll') -ErrorAction Stop
          $source=[IO.File]::ReadAllText('work/AirtelMonitorNative.cs')
          if(!$source.Contains('const string AppVersion = "5.6.0";') -or !$source.Contains('Text="T-Net"') -or !$source.Contains('RenameShortcuts()')){throw 'T-Net branding changes missing'}
          New-Item -ItemType Directory releases -Force | Out-Null
          Compress-Archive work/AirtelMonitorNative.cs,work/monitor.ps1 releases/AirtelMonitor-5.6.0.zip
          $sha=(Get-FileHash releases/AirtelMonitor-5.6.0.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{version='5.6.0';status='available';packageUrl='https://raw.githubusercontent.com/adesanoyeademola/airtel-data-monitor/main/releases/AirtelMonitor-5.6.0.zip';sha256=$sha;notes='Rename the desktop interface, window, tray label and existing shortcut to T-Net while keeping monitoring data.'}
          [IO.File]::WriteAllText('updates/stable.json',($manifest | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/AirtelMonitor-5.6.0.zip updates/stable.json
          git commit -m 'Publish validated T-Net branding version 5.6.0'
          git push
