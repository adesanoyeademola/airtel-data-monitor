name: Publish T-Net Windows v6.4 sample latency
on:
  push:
    paths:
      - '.github/workflows/v64.yml'
      - 'release-candidate/patch_v64.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile latency indicator and verify monitoring engine unchanged
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory work -Force | Out-Null
          Expand-Archive releases/AirtelMonitor-6.3.0.zip work
          $oldEngineHash=(Get-FileHash 'work/monitor.ps1' -Algorithm SHA256).Hash
          python release-candidate/patch_v64.py
          if($LASTEXITCODE -ne 0){throw 'Source patch failed'}
          $newEngineHash=(Get-FileHash 'work/monitor.ps1' -Algorithm SHA256).Hash
          if($oldEngineHash -ne $newEngineHash){throw 'Monitoring engine was unexpectedly changed'}
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('work/monitor.ps1',[ref]$null,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw ('PowerShell engine syntax failure: '+($errors | Out-String))}
          # Reference list must match the updater already installed on the user's PC.
          Add-Type -Path work/AirtelMonitorNative.cs -OutputAssembly test.exe -OutputType WindowsApplication -ReferencedAssemblies @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','System.Windows.Forms.DataVisualization.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll') -ErrorAction Stop
          $src=[IO.File]::ReadAllText('work/AirtelMonitorNative.cs')
          foreach($required in @('const string AppVersion = "6.4.0";','RefreshSampleAgeIndicator()','Stale sample: ','Last sample: ','mostRecentAdapterSampleUtc=sampleUtc.ToUniversalTime();','RefreshUsageAsync()','CaptureLiveSpeedSample(','AutoRecoverEngine()')){
            if(!$src.Contains($required)){throw "Missing expected code: $required"}
          }
          $output='releases/AirtelMonitor-6.4.0.zip'
          Compress-Archive work/AirtelMonitorNative.cs,work/monitor.ps1 $output
          $sha=(Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            version='6.4.0'
            status='available'
            packageUrl='https://raw.githubusercontent.com/adesanoyeademola/airtel-data-monitor/main/releases/AirtelMonitor-6.4.0.zip'
            sha256=$sha
            notes='Displays the real age of the most recent adapter measurement in the Network panel and flags stale readings after 3 seconds. Speed calculations, startup and saved usage unchanged.'
          }
          [IO.File]::WriteAllText('updates/stable.json',($manifest | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $output updates/stable.json
          git commit -m 'Publish T-Net v6.4 sample-age indicator'
          git push
