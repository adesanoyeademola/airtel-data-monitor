name: Publish Airtel Monitor v5.5
on:
  push:
    paths:
      - '.github/workflows/v55.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate v5.5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory work | Out-Null
          Expand-Archive releases/AirtelMonitor-5.4.0.zip work
          python release-candidate/patch_v55.py
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('work/monitor.ps1',[ref]$null,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw 'Monitoring engine syntax invalid'}
          Add-Type -Path work/AirtelMonitorNative.cs -OutputAssembly test.exe -OutputType WindowsApplication -ReferencedAssemblies @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','System.Windows.Forms.DataVisualization.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll') -ErrorAction Stop
          $source=[IO.File]::ReadAllText('work/AirtelMonitorNative.cs')
          if(!$source.Contains('5.5.0') -or !$source.Contains('Old monitoring service') -or !$source.Contains(' Mbps')){throw 'Required update changes missing'}
          New-Item -ItemType Directory releases -Force | Out-Null
          Compress-Archive work/AirtelMonitorNative.cs,work/monitor.ps1 releases/AirtelMonitor-5.5.0.zip
          $sha=(Get-FileHash releases/AirtelMonitor-5.5.0.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{version='5.5.0';status='available';packageUrl='https://raw.githubusercontent.com/adesanoyeademola/airtel-data-monitor/main/releases/AirtelMonitor-5.5.0.zip';sha256=$sha;notes='Task Manager-aligned Kbps/Mbps live speeds and warning when an old monitoring service is still running.'}
          [IO.File]::WriteAllText('updates/stable.json',($manifest | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/AirtelMonitor-5.5.0.zip updates/stable.json
          git commit -m 'Publish validated Airtel Monitor v5.5.0'
          git push
