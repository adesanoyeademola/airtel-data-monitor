name: Verify T-Net v6.20 Appearance Modes
on:
  push:
    branches: [feature/header-monthly-rounded-v620]
    paths:
      - '.github/workflows/v620-interface.yml'
      - 'release-candidate/patch_v618.py'
      - 'release-candidate/patch_v619.py'
      - 'release-candidate/patch_v620.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v6.17 source without modifying monitoring engine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory work -Force | Out-Null
          Expand-Archive releases/AirtelMonitor-6.17.0.zip work
          $baselineHash=(Get-FileHash work/monitor.ps1 -Algorithm SHA256).Hash
          Copy-Item work/AirtelMonitorNative.cs work/Original.cs
          python release-candidate/patch_v618.py
          if($LASTEXITCODE -ne 0){throw 'v6.18 baseline patch failed'}
          python release-candidate/patch_v619.py
          if($LASTEXITCODE -ne 0){throw 'v6.19 appearance patch failed'}
          python release-candidate/patch_v620.py
          if($LASTEXITCODE -ne 0){throw 'Appearance patch failed'}
          if((Get-FileHash work/monitor.ps1 -Algorithm SHA256).Hash -ne $baselineHash){throw 'Monitoring engine changed'}
          @'
          from pathlib import Path
          a=Path("work/Original.cs").read_text(encoding="utf-8-sig")
          b=Path("work/AirtelMonitorNative.cs").read_text(encoding="utf-8-sig")
          for q in ['TrackUsageCheckpoint(', 'downloadSpeed.Text=Rate(rateRx)',
                    'uploadSpeed.Text=Rate(rateTx)','new VScrollBar{',
                    'signalTrayPopup.Deactivate+=',
                    'UpdateSignalTrayState(stat,Str(d,"adapterName"),Str(d,"wifiSignal"));']:
              assert q in a and q in b,q
          for q in ['void SelectAppearance(string choice)','void CheckSystemAppearance()',
                    'void ApplyAppearance(bool force)','AppsUseLightTheme',
                    'appearance.txt','const string AppVersion = "6.20.0";',
                    'MonthTotalFromExistingDays(d)','head.Controls.Add(compactSpeeds,1,0)',
                    'RoundSurface(card,15)']:
              assert q in b,q
          assert a.count('UpdateSignalDisplay(Str(d,"wifiSignal"),stat=="tracking");') == b.count('UpdateSignalDisplay(Str(d,"wifiSignal"),stat=="tracking");')
          print("PASS: appearance changes retain existing monitoring and flyout hooks")
          '@ | Set-Content work/test_appearance.py -Encoding UTF8
          python work/test_appearance.py
          if($LASTEXITCODE -ne 0){throw 'Appearance source tests failed'}
      - name: Compile Windows native app
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('work/monitor.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count){throw 'Monitor script has syntax errors'}
          Add-Type -Path work/AirtelMonitorNative.cs -OutputAssembly work/AirtelDataMonitor.exe -OutputType WindowsApplication -ReferencedAssemblies @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','System.Windows.Forms.DataVisualization.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll') -ErrorAction Stop
          if(!(Test-Path work/AirtelDataMonitor.exe)){throw 'Missing executable'}
          Write-Host 'PASS: v6.20 WinForms executable compiled'
      - name: Package preview for review (not a stable release)
        shell: pwsh
        run: |
          Compress-Archive -Path work/AirtelMonitorNative.cs,work/monitor.ps1 -DestinationPath work/AirtelMonitor-6.20.0-preview.zip
          Compress-Archive -Path work/AirtelDataMonitor.exe,work/AirtelMonitorNative.cs,work/monitor.ps1 -DestinationPath work/T-Net-6.20.0-Windows-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: t-net-6-20-appearance-preview
          path: |
            work/AirtelMonitor-6.20.0-preview.zip
            work/T-Net-6.20.0-Windows-preview.zip
          retention-days: 14
