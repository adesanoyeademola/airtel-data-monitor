name: Publish T-Net Windows v5.9 updater compatibility repair
on:
  push:
    paths:
      - '.github/workflows/v59.yml'
      - 'release-candidate/patch_v59.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test against existing user updater references and publish
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory work -Force | Out-Null
          Expand-Archive releases/AirtelMonitor-5.8.0.zip work
          python release-candidate/patch_v59.py
          if($LASTEXITCODE -ne 0){throw 'Source patch failed'}
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('work/monitor.ps1',[ref]$null,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw ('PowerShell syntax failure: '+($errors | Out-String))}
          # These are the references used by the user's already-installed updater.
          # DO NOT add System.Management.dll to this test.
          Add-Type -Path work/AirtelMonitorNative.cs -OutputAssembly test.exe -OutputType WindowsApplication -ReferencedAssemblies @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','System.Windows.Forms.DataVisualization.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll') -ErrorAction Stop
          $src=[IO.File]::ReadAllText('work/AirtelMonitorNative.cs')
          if(!$src.Contains('const string AppVersion = "5.9.0";')){throw 'Version missing'}
          if($src.Contains('using System.Management;') -or $src.Contains('new ManagementObjectSearcher(')){throw 'System.Management still required at compile time'}
          if(!$src.Contains('PulseIndicator()') -or !$src.Contains('NumberStyles.Float,CultureInfo.InvariantCulture')){throw 'Existing fixes missing'}
          $output='releases/AirtelMonitor-5.9.0.zip'
          Compress-Archive work/AirtelMonitorNative.cs,work/monitor.ps1 $output
          $sha=(Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            version='5.9.0'
            status='available'
            packageUrl='https://raw.githubusercontent.com/adesanoyeademola/airtel-data-monitor/main/releases/AirtelMonitor-5.9.0.zip'
            sha256=$sha
            notes='Fix System.Management compilation error in the existing T-Net updater; retain speed correction, monitoring status indicator, and usage history.'
          }
          [IO.File]::WriteAllText('updates/stable.json',($manifest | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $output updates/stable.json
          git commit -m 'Publish validated T-Net 5.9 existing-updater compatibility repair'
          git push
