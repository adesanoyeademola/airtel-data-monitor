name: Publish T-Net Windows v6.3 responsive live readings
on:
  push:
    paths:
      - '.github/workflows/v63.yml'
      - 'release-candidate/patch_v63.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify async UI responsiveness and preserved engine
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory work -Force | Out-Null
          Expand-Archive releases/AirtelMonitor-6.2.0.zip work
          python release-candidate/patch_v63.py
          if($LASTEXITCODE -ne 0){throw 'Source patch failed'}
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('work/monitor.ps1',[ref]$null,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw ('PowerShell engine syntax failure: '+($errors | Out-String))}
          Add-Type -Path work/AirtelMonitorNative.cs -OutputAssembly test.exe -OutputType WindowsApplication -ReferencedAssemblies @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','System.Windows.Forms.DataVisualization.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll') -ErrorAction Stop
          $src=[IO.File]::ReadAllText('work/AirtelMonitorNative.cs')
          $engine=[IO.File]::ReadAllText('work/monitor.ps1')
          foreach($required in @('const string AppVersion = "6.3.0";','refreshTimer.Interval = 500','async void RefreshUsageAsync()','Task.Run(()=>GetDataFast())','usagePollInProgress','CaptureLiveSpeedSample(','PulseIndicator()','AutoRecoverEngine()')){
            if(!$src.Contains($required)){throw "Missing expected code: $required"}
          }
          if(!$engine.Contains('Get-NetAdapterStatistics -Name $script:State.adapterName')){throw 'Core adapter usage meter missing'}
          if(!$engine.Contains('Get-CachedAdapters')){throw 'Metadata caching missing'}
          # Guard against accidental modification of the on-disk measurement
          # format. No history files are shipped with the update.
          $output='releases/AirtelMonitor-6.3.0.zip'
          Compress-Archive work/AirtelMonitorNative.cs,work/monitor.ps1 $output
          $sha=(Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            version='6.3.0'
            status='available'
            packageUrl='https://raw.githubusercontent.com/adesanoyeademola/airtel-data-monitor/main/releases/AirtelMonitor-6.3.0.zip'
            sha256=$sha
            notes='Make live readings more responsive: nonblocking 500ms dashboard polling, no overlapping requests, faster cached metadata and lighter chart redraws. Retains direct adapter sampling and existing usage history.'
          }
          [IO.File]::WriteAllText('updates/stable.json',($manifest | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $output updates/stable.json
          git commit -m 'Publish validated T-Net v6.3 responsiveness update'
          git push
