name: Publish T-Net v6.9 timestamped usage log
on:
  push:
    paths:
      - '.github/workflows/v69.yml'
      - 'release-candidate/patch_v69.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify timestamped usage timeline without changing measurements
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory work -Force | Out-Null
          Expand-Archive releases/AirtelMonitor-6.8.0.zip work
          Copy-Item work/AirtelMonitorNative.cs work/BaselineNative.cs
          $engineHashBefore=(Get-FileHash work/monitor.ps1 -Algorithm SHA256).Hash
          python release-candidate/patch_v69.py
          if($LASTEXITCODE -ne 0){throw 'Source patch failed'}
          if((Get-FileHash work/monitor.ps1 -Algorithm SHA256).Hash -ne $engineHashBefore){throw 'Engine changed unexpectedly'}
          $source=[IO.File]::ReadAllText('work/AirtelMonitorNative.cs')
          foreach($expected in @('const string AppVersion = "6.9.0";','TrackUsageCheckpoint(','usage-timeline.csv','ShowUsageLogRow(','Live speed source: Windows counters','wifi.Text=HotspotLabel(currentSsid);','downloadSpeed.Text=Rate(rateRx);','uploadSpeed.Text=Rate(rateTx);')){
            if(!$source.Contains($expected)){throw "Missing expected source: $expected"}
          }
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('work/monitor.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){throw ('PowerShell engine syntax failure: '+($errors | Out-String))}
          Add-Type -Path work/AirtelMonitorNative.cs -OutputAssembly test.exe -OutputType WindowsApplication -ReferencedAssemblies @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','System.Windows.Forms.DataVisualization.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll') -ErrorAction Stop
          $out='releases/AirtelMonitor-6.9.0.zip'
          Compress-Archive work/AirtelMonitorNative.cs,work/monitor.ps1 $out
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            version='6.9.0'
            status='available'
            packageUrl='https://raw.githubusercontent.com/adesanoyeademola/airtel-data-monitor/main/releases/AirtelMonitor-6.9.0.zip'
            sha256=$sha
            notes='Moves live-speed source text slightly above Adapter and adds timestamped, locally saved minute-scale Wi-Fi usage checkpoints with download, upload, and running daily totals in an optional Usage log view and CSV. Live speed calculations, monitoring engine and existing usage.json unchanged.'
          }
          [IO.File]::WriteAllText('updates/stable.json',($manifest|ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $out updates/stable.json
          git commit -m 'Publish T-Net v6.9 timestamped device-usage log'
          git push
