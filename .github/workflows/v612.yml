name: Publish T-Net v6.12 signal strength bar only
on:
  push:
    paths:
      - '.github/workflows/v612.yml'
      - 'release-candidate/patch_v612.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-build-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply display-only patch and prove no unrelated changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory work -Force | Out-Null
          Expand-Archive releases/AirtelMonitor-6.11.0.zip work
          Copy-Item work/AirtelMonitorNative.cs work/BaselineNative.cs
          $engineBefore=(Get-FileHash work/monitor.ps1 -Algorithm SHA256).Hash
          python release-candidate/patch_v612.py
          if($LASTEXITCODE -ne 0){throw 'Signal bar patch failed'}
          if((Get-FileHash work/monitor.ps1 -Algorithm SHA256).Hash -ne $engineBefore){throw 'Monitoring engine changed unexpectedly'}
          @'
          from pathlib import Path
          before=Path('work/BaselineNative.cs').read_text(encoding='utf-8-sig')
          after=Path('work/AirtelMonitorNative.cs').read_text(encoding='utf-8-sig')
          after=after.replace('const string AppVersion = "6.12.0";','const string AppVersion = "6.11.0";')
          after=after.replace('    Panel signalStrengthTrack, signalStrengthFill;\n','')
          a=after.index('      detailScroll.Controls.Add(LabelText("Wi-Fi signal strength"));')
          b=after.index('      detailScroll.Controls.Add(LabelText("Last update"));',a)
          after=after[:a]+'      detailScroll.Controls.Add(LabelText("Wi-Fi signal strength"));signalStrength=LabelText("—",12,true);detailScroll.Controls.Add(signalStrength);\n'+after[b:]
          a=after.index('    // The exact reported 0-100% WLAN signal quality is displayed directly.')
          b=after.index('    void ApplyUsage(Dictionary<string,object> d){',a)
          after=after[:a]+after[b:]
          after=after.replace('        UpdateSignalDisplay(Str(d,"wifiSignal"),stat=="tracking");', '        if(signalStrength!=null){\n          string strength=Str(d,"wifiSignal");\n          signalStrength.Text=stat=="tracking" && !String.IsNullOrWhiteSpace(strength)?strength+"%":"—";\n        }')
          if before!=after:
            from difflib import unified_diff
            print(''.join(list(unified_diff(before.splitlines(True),after.splitlines(True)))[:50]))
            raise RuntimeError('Detected changes outside signal line, percentage, and version')
          print('PASS: only Wi-Fi signal bar UI and application version changed')
          '@ | Set-Content work/verify_source.py -Encoding UTF8
          python work/verify_source.py
          if($LASTEXITCODE -ne 0){throw 'Source equivalence check failed'}
      - name: Compile Windows application and validate color thresholds
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $errs=$null
          [System.Management.Automation.Language.Parser]::ParseFile('work/monitor.ps1',[ref]$null,[ref]$errs)|Out-Null
          if($errs.Count){throw 'Monitoring script syntax invalid'}
          Add-Type -Path work/AirtelMonitorNative.cs -OutputAssembly work/AirtelDataMonitor.exe -OutputType WindowsApplication -ReferencedAssemblies @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','System.Windows.Forms.DataVisualization.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll') -ErrorAction Stop
          $asm=[Reflection.Assembly]::LoadFile((Resolve-Path 'work/AirtelDataMonitor.exe').Path)
          $klass=$asm.GetType('AirtelMonitorNative.MainForm',$true)
          $flags=[Reflection.BindingFlags]::Static -bor [Reflection.BindingFlags]::NonPublic
          $method=$klass.GetMethod('SignalBarColor',$flags)
          if($null -eq $method){throw 'Signal color method missing'}
          $cases=@(
            @(0,240,105,105),@(49,240,105,105),
            @(50,236,185,65),@(79,236,185,65),
            @(80,79,212,161),@(100,79,212,161)
          )
          foreach($c in $cases){
            $color=[System.Drawing.Color]$method.Invoke($null,[object[]]@([int]$c[0]))
            if($color.R -ne $c[1] -or $color.G -ne $c[2] -or $color.B -ne $c[3]){
              throw "Signal color failed at $($c[0])% (actual $color)"
            }
            Write-Host "PASS: $($c[0])% color RGB($($color.R),$($color.G),$($color.B))"
          }
          if(!(Test-Path 'work/AirtelDataMonitor.exe')){throw 'Compiled EXE missing'}
      - name: Publish source update and compiled Windows package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='releases/AirtelMonitor-6.12.0.zip'
          $binary='releases/T-Net-6.12.0-Windows-compiled.zip'
          Compress-Archive work/AirtelMonitorNative.cs,work/monitor.ps1 $source
          Compress-Archive work/AirtelDataMonitor.exe,work/AirtelMonitorNative.cs,work/monitor.ps1 $binary
          $hash=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            version='6.12.0'
            status='available'
            packageUrl='https://raw.githubusercontent.com/adesanoyeademola/airtel-data-monitor/main/releases/AirtelMonitor-6.12.0.zip'
            sha256=$hash
            notes='Display-only color-coded live Wi-Fi signal bar with exact Windows-reported percentage: green 80–100%, yellow 50–79%, red 0–49%; unavailable on disconnect. Monitoring service, adapter switching, speeds, data history, layout and charts unchanged.'
          }
          [IO.File]::WriteAllText('updates/stable.json',($manifest|ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $source $binary updates/stable.json
          git commit -m 'Publish T-Net v6.12 signal strength color bar'
          git push
