name: Publish T-Net Windows v6.2 speed history
on:
  push:
    paths:
      - '.github/workflows/v62.yml'
      - 'release-candidate/patch_v62.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify charts and publish
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory work -Force | Out-Null
          Expand-Archive releases/AirtelMonitor-6.1.0.zip work
          python release-candidate/patch_v62.py
          if($LASTEXITCODE -ne 0){throw 'Source patch failed'}
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('work/monitor.ps1',[ref]$null,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw ('PowerShell engine syntax failure: '+($errors | Out-String))}
          Add-Type -Path work/AirtelMonitorNative.cs -OutputAssembly test.exe -OutputType WindowsApplication -ReferencedAssemblies @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','System.Windows.Forms.DataVisualization.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll') -ErrorAction Stop
          $src=[IO.File]::ReadAllText('work/AirtelMonitorNative.cs')
          foreach($required in @('const string AppVersion = "6.2.0";','CaptureLiveSpeedSample(','RenderLiveSpeedGraph()','Live speed','Daily usage','AutoRecoverEngine()','PulseIndicator()')){
            if(!$src.Contains($required)){throw "Missing expected code: $required"}
          }
          $output='releases/AirtelMonitor-6.2.0.zip'
          Compress-Archive work/AirtelMonitorNative.cs,work/monitor.ps1 $output
          $sha=(Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            version='6.2.0'
            status='available'
            packageUrl='https://raw.githubusercontent.com/adesanoyeademola/airtel-data-monitor/main/releases/AirtelMonitor-6.2.0.zip'
            sha256=$sha
            notes='Adds a Live speed and Daily usage chart switch, 90-second timestamped download/upload history, missing-sample gaps and automatic Kbps/Mbps scaling. Leaves monitoring engine and stored usage untouched.'
          }
          [IO.File]::WriteAllText('updates/stable.json',($manifest | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $output updates/stable.json
          git commit -m 'Publish T-Net v6.2 timestamped live-speed graph'
          git push
